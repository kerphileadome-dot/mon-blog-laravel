# Variables mail — Railway Hobby bloque SMTP. Utiliser Brevo (API HTTPS).
# 1. Compte gratuit https://www.brevo.com
# 2. Vérifiez un expéditeur (ex: kerphilesaint@gmail.com)
# 3. Ajoutez BREVO_API_KEY dans Railway Variables
[variables]
MAIL_MAILER = "brevo"
MAIL_FROM_ADDRESS = "kerphilesaint@gmail.com"
MAIL_FROM_NAME = "KerpheX Blog"
# BREVO_API_KEY : à définir dans Railway Variables
# Local : gardez MAIL_MAILER=smtp dans .env

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
cmds = [
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = 'bash railway-init.sh && php artisan serve --host=0.0.0.0 --port=$PORT'
