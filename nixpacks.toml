# Variables mail — Railway Hobby bloque SMTP (587/465). Utiliser Resend (HTTPS).
# 1. Créez un compte sur https://resend.com
# 2. Ajoutez RESEND_API_KEY dans Railway Variables
# 3. Vérifiez un domaine d'envoi (ou upgrade Railway Pro pour Gmail SMTP)
[variables]
MAIL_MAILER = "resend"
MAIL_FROM_ADDRESS = "kerphilesaint@gmail.com"
MAIL_FROM_NAME = "KerpheX Blog"
# RESEND_API_KEY : à définir dans Railway Variables
# Pour le local, gardez MAIL_MAILER=smtp dans .env

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
cmds = [
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = 'bash railway-init.sh && php artisan serve --host=0.0.0.0 --port=$PORT'
