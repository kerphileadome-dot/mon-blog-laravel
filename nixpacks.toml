# Variables mail (sauf MAIL_PASSWORD — secret à définir sur Railway ou via scripts/sync-mail-to-railway.ps1)
[variables]
MAIL_MAILER = "smtp"
MAIL_HOST = "smtp.gmail.com"
MAIL_PORT = "587"
MAIL_USERNAME = "kerphilesaint@gmail.com"
MAIL_ENCRYPTION = "tls"
MAIL_FROM_ADDRESS = "kerphilesaint@gmail.com"
MAIL_FROM_NAME = "KerpheX Blog"

[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]
cmds = [
    'php artisan config:cache',
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = 'bash railway-init.sh && php artisan serve --host=0.0.0.0 --port=$PORT'
